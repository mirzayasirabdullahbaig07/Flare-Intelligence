<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-label="FLARE Intelligence - AI-Powered Microgravity Combustion Analysis and Space Fire Safety Insights">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0D13"/><stop offset="1" stop-color="#131826"/></linearGradient>
<linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#F59E0B"/><stop offset="0.6" stop-color="#E8933A" stop-opacity=".6"/><stop offset="1" stop-color="#E8933A" stop-opacity="0"/></linearGradient>
<radialGradient id="sun" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFF4DC"/><stop offset=".28" stop-color="#FFC46B"/><stop offset=".6" stop-color="#E8933A"/><stop offset="1" stop-color="#7A3E10"/></radialGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#F59E0B" stop-opacity=".55"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" opacity=".06"/></pattern>
<linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<style>
text{font-family:'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif}
.pulse{animation:p 4s ease-in-out infinite;transform-origin:1290px 250px}
@keyframes p{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.12);opacity:1}}
.tw{animation:t 3s ease-in-out infinite}
@keyframes t{0%,100%{opacity:.15}50%{opacity:.8}}
</style>
</defs>
<rect width="1600" height="500" fill="url(#bg)"/>
<rect width="1600" height="500" fill="url(#dots)"/>
<rect width="1600" height="6" fill="url(#bar)"/>
<!-- sun & orbits -->
<g>
<circle class="pulse" cx="1290" cy="250" r="190" fill="url(#glow)"/>
<circle cx="1290" cy="250" r="160" fill="none" stroke="#E8933A" stroke-opacity=".35"/>
<circle cx="1290" cy="250" r="215" fill="none" stroke="#fff" stroke-opacity=".12" stroke-dasharray="2 7"/>
<line x1="1050" y1="250" x2="1530" y2="250" stroke="#fff" stroke-opacity=".08"/><line x1="1290" y1="30" x2="1290" y2="470" stroke="#fff" stroke-opacity=".08"/>
<g transform="rotate(-18 1290 250)"><ellipse cx="1290" cy="250" rx="255" ry="92" fill="none" stroke="#E8933A" stroke-opacity=".8" stroke-width="1.5"/>
<circle r="7" fill="#fff"><animateMotion dur="14s" repeatCount="indefinite" path="M1545,250 A255,92 0 1,1 1035,250 A255,92 0 1,1 1545,250"/></circle></g>
<g transform="rotate(-18 1290 250)"><ellipse cx="1290" cy="250" rx="205" ry="64" fill="none" stroke="#fff" stroke-opacity=".3" transform="rotate(8 1290 250)"/>
<circle r="5" fill="#E8933A"><animateMotion dur="9s" repeatCount="indefinite" path="M1035,250 A255,92 0 1,0 1545,250 A255,92 0 1,0 1035,250"/></circle></g>
<circle cx="1290" cy="250" r="82" fill="url(#sun)"/>
<circle cx="1290" cy="250" r="82" fill="none" stroke="#FFD08A" stroke-opacity=".35"/>
</g>
<g fill="#fff"><circle class="tw" cx="980" cy="70" r="1.8"/><circle class="tw" style="animation-delay:1s" cx="1520" cy="90" r="1.5"/><circle class="tw" style="animation-delay:2s" cx="1100" cy="440" r="1.6"/><circle class="tw" style="animation-delay:.5s" cx="1555" cy="372" r="1.8"/></g>
<!-- text -->
<rect x="80" y="62" width="48" height="4" rx="2" fill="#E8933A"/>
<text x="80" y="104" font-size="17" font-weight="600" letter-spacing="5.5" fill="#E8933A">FLAME IN FREEFALL  |  NASA SPACE APPS 2026</text>
<text x="76" y="205" font-size="96" font-weight="800" fill="#fff">FLARE <tspan fill="#E8933A">Intelligence</tspan></text>
<text x="80" y="258" font-size="29" fill="#C9CFDC">AI-Powered Microgravity Combustion Analysis</text>
<text x="80" y="297" font-size="29" fill="#C9CFDC">and Space Fire Safety Insights</text>
<rect x="80" y="330" width="917" height="1.5" fill="url(#fade)"/>
<g font-size="17" font-weight="600" fill="#E6E9F2" text-anchor="middle"><rect x="80" y="355" width="190" height="42" rx="21" fill="#161B28" stroke="#E8933A"/><text x="175.0" y="382">BASS-II | PSI-25</text><rect x="284" y="355" width="235" height="42" rx="21" fill="#161B28" stroke="#3A4256"/><text x="401.5" y="382">Source-cited answers</text><rect x="533" y="355" width="300" height="42" rx="21" fill="#161B28" stroke="#3A4256"/><text x="683.0" y="382">Transparent evidence scoring</text><rect x="847" y="355" width="150" height="42" rx="21" fill="#161B28" stroke="#3A4256"/><text x="922.0" y="382">No paid API</text></g>
<text x="80" y="450" font-size="16" fill="#8A91A3">Evidence-exploration tool, not a fire-risk predictor</text>
<text x="1530" y="424" font-size="16" font-weight="600" letter-spacing="5" fill="#E8933A" text-anchor="end">TEAM TECHBEES</text><text x="1530" y="452" font-size="17" fill="#C9CFDC" text-anchor="end">Hamna Munir  <tspan fill="#E8933A">•</tspan>  Mirza Yasir Abdullah Baig</text>
</svg>
